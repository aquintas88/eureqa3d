<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso — Eureqa3D</title>
  <link rel="icon" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    body { min-height:100vh; display:grid; place-items:center;
           background: linear-gradient(135deg, var(--teal-dark), var(--teal-700)); padding:1.5rem; }
    .login { width:100%; max-width:400px; background:#fff; border-radius:18px; padding:2.4rem; box-shadow:0 24px 60px rgba(0,0,0,.25); }
    .login img { height:42px; margin-bottom:1.4rem; }
    .login h1 { font-size:1.5rem; }
    .login form { display:flex; flex-direction:column; gap:1rem; margin-top:1.4rem; }
    .login label { font-family:var(--head); font-weight:600; font-size:.9rem; display:flex; flex-direction:column; gap:.35rem; }
    .login input { padding:.75rem .9rem; border:1px solid var(--line); border-radius:10px; font:inherit; }
    .login input:focus { outline:2px solid var(--teal); border-color:var(--teal); }
    .login .btn { justify-content:center; }
    .login .err { background:#fdecea; color:#b3261e; padding:.7rem .9rem; border-radius:10px; font-size:.9rem; margin:0; }
    .login .divider { display:flex; align-items:center; gap:1rem; margin:1.4rem 0; color:var(--text-secondary); }
    .login .divider::before, .login .divider::after { content:''; flex:1; height:1px; background:var(--line); }
    .login .btn-google { background:#fff; border:2px solid var(--line); color:var(--text); text-decoration:none; padding:.75rem .9rem; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.5rem; transition:all .2s ease-out; }
    .login .btn-google:hover { background:#f8f8f8; border-color:var(--teal); }
  </style>
</head>
<body>
  <div class="login">
    <img src="/assets/img/logo.svg" alt="Eureqa3D" />
    <h1>Zona privada</h1>
    <p class="muted">Accede para gestionar el contenido del portal.</p>
    <form id="login-form">
      <label>Email
        <input type="email" name="email" autocomplete="username" required />
      </label>
      <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p id="error" class="err" hidden></p>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
    <div class="divider">O accede con</div>
    <a href="/auth/google" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Google
    </a>
  </div>
  <script src="/assets/login.js"></script>
</body>
</html>
